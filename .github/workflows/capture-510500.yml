name: Capture 510500 closing option chain

on:
  schedule:
    # Start the runner before the 07:01 UTC observation. Python waits for Shanghai 15:01.
    - cron: '35 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c configs/market-data/requirements.txt -e '.[market]'
      - run: python -m experiments.scheduled_options datasets/capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-510500-${{ github.run_id }}-${{ github.run_attempt }}
          path: datasets/capture/
          if-no-files-found: error
          retention-days: 90
