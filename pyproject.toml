[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-factorlab"
version = "0.2.0"
description = "Local daily-factor research, reproducible experiments and constrained backtests"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
market = ["duckdb>=1.2,<3"]
legacy = ["requests>=2.31", "lxml>=4.9", "openpyxl>=3.1", "xlrd>=2.0", "html5lib>=1.1", "beautifulsoup4>=4.12"]

[project.scripts]
factorlab = "factorlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["factorlab*"]
